name: Trendyol Interview Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write

jobs:
  tip:
    name: trendyol-interview-pipeline
    runs-on: ubuntu-latest
    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------
      # SAST (Semgrep) -> SARIF -> GitHub Security Dashboard
      # ---------------------------
      - name: Semgrep scan (SARIF)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci
          args: semgrep scan --config p/ci --sarif --output=semgrep.sarif

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # ---------------------------
      # Secret scanning (Gitleaks) -> SARIF -> GitHub Security Dashboard (diff/commit-based)
      # NOTE: outputs results.sarif by default
      # ---------------------------
      - name: Gitleaks Secret Scan (CI diff scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks SARIF (CI diff scan) to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          category: gitleaks

      # ---------------------------
      # Build container image
      # ---------------------------
      - name: Build Docker image
        run: docker build -t juice-shop:${{ github.sha }} .

      # ---------------------------
      # SBOM (Syft) -> artifact
      # ---------------------------
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: juice-shop:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      # ---------------------------
      # Container vuln scan (Grype) -> SARIF -> GitHub Security Dashboard
      # NOTE: anchore/scan-action writes results.sarif by default
      # ---------------------------
      - name: Scan image with Grype (SARIF)
        uses: anchore/scan-action@v3
        with:
          image: juice-shop:${{ github.sha }}
          fail-build: "false"
          output-format: sarif
          severity-cutoff: high

      - name: Upload Grype SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          category: grype
  
  gitleaks_full:
    name: gitleaks-full-repo-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
  
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
  
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
          | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
  
      - name: Gitleaks Full History Scan (SARIF)
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --report-format sarif \
            --report-path gitleaks-full.sarif \
            --exit-code 0
  
      - name: Upload Gitleaks Full Scan SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gitleaks-full.sarif
          category: gitleaks-full
