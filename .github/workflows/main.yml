name: Trendyol Interview Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: "0 2 * * 0" # weekly full scan (Sun 02:00 UTC)

permissions:
  contents: read
  security-events: write

jobs:
  main:
    name: ci-security-scans
    runs-on: ubuntu-latest
    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------
      # SAST (Semgrep) -> SARIF -> GitHub Security Dashboard
      # ---------------------------
      - name: Semgrep scan (SARIF)
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/ci
          args: semgrep scan --config p/ci --sarif --output=semgrep.sarif

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # ---------------------------
      # Secret scanning (Gitleaks) - CI mode
      # Option A: working tree only (NO git history) -> avoids legacy secret noise
      # ---------------------------
      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
          | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks CI scan (working tree only) (SARIF)
        run: |
          gitleaks detect \
            --source . \
            --no-git \
            --report-format sarif \
            --report-path gitleaks-ci.sarif \
            --exit-code 0

      - name: Upload Gitleaks CI SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gitleaks-ci.sarif
          category: gitleaks-ci

      # ---------------------------
      # Build container image
      # ---------------------------
      - name: Build Docker image
        run: docker build -t juice-shop:${{ github.sha }} .

      # ---------------------------
      # SBOM (Syft) -> artifact
      # ---------------------------
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: juice-shop:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      # ---------------------------
      # Container vuln scan (Grype) -> SARIF -> GitHub Security Dashboard
      # Note: scan-action writes results.sarif by default; rename to avoid collisions
      # ---------------------------
      - name: Scan image with Grype (SARIF)
        uses: anchore/scan-action@v3
        with:
          image: juice-shop:${{ github.sha }}
          fail-build: "false"
          output-format: sarif
          severity-cutoff: high

      - name: Rename Grype SARIF (avoid results.sarif collisions)
        if: always()
        run: |
          if [ -f results.sarif ]; then mv results.sarif grype.sarif; fi

      - name: Upload Grype SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype.sarif
          category: grype

  gitleaks_full:
    name: gitleaks-full-history-audit
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
          | tar -xz
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks Full History Scan (SARIF)
        run: |
          gitleaks detect \
            --source . \
            --log-opts="--all" \
            --report-format sarif \
            --report-path gitleaks-full.sarif \
            --exit-code 0

      - name: Upload Gitleaks Full Scan SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: gitleaks-full.sarif
          category: gitleaks-full
