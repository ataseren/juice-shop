name: Trendyol Interview Pipeline

on:
  workflow_dispatch:
  push:
    branches: [ master ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  security-events: write

jobs:
  tip:
    name: trendyol-interview-pipeline
    runs-on: ubuntu-latest
    if: (github.actor != 'dependabot[bot]')

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---------------------------
      # SAST (Semgrep) -> SARIF -> GitHub Security Dashboard
      # Fixes:
      # - remove unsupported generateSarif input
      # - avoid semgrep ci (fails when logged in + --config)
      # ---------------------------
      - name: Semgrep scan (SARIF)
        uses: returntocorp/semgrep-action@v1
        with:
          entryPoint: scan
          config: p/ci
          args: --sarif --output=semgrep.sarif
        # IMPORTANT: No SEMGREP_APP_TOKEN here (we are not using semgrep ci / upload to semgrep app)

      - name: Upload Semgrep SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      # ---------------------------
      # Secret scanning (Gitleaks) -> SARIF -> GitHub Security Dashboard
      # Fixes:
      # - remove unsupported args input
      # - upload the actual output file: results.sarif
      # ---------------------------
      - name: Gitleaks Secret Scan (SARIF)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Gitleaks SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: results.sarif
          category: gitleaks

      # ---------------------------
      # Build container image
      # ---------------------------
      - name: Build Docker image
        run: docker build -t juice-shop:${{ github.sha }} .

      # ---------------------------
      # SBOM (Syft) -> artifact
      # ---------------------------
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: juice-shop:${{ github.sha }}
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      # ---------------------------
      # Container vuln scan (Grype) -> SARIF -> GitHub Security Dashboard
      # ---------------------------
      - name: Scan image with Grype (SARIF)
        uses: anchore/scan-action@v3
        with:
          image: juice-shop:${{ github.sha }}
          fail-build: "false"
          output-format: sarif
          output-file: grype.sarif
          severity-cutoff: high

      - name: Upload Grype SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: grype.sarif
          category: grype
